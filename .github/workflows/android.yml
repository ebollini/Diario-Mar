name: App Android

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Salva il log in caso di errore
        if: failure()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . >/dev/null
          touch build.log
          grep -E "^e: |error:|FAILURE|What went wrong|> " build.log | head -300 > errori.txt || true
          tail -400 build.log > build-tail.log
          git add -f errori.txt build-tail.log
          git commit -m "log ${{ github.run_number }}"
          git push -f origin ci-log

      - name: Pubblica la versione
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_PASS" ]; then FIRMA="Firma definitiva."; else FIRMA="ATTENZIONE: firma provvisoria (manca il secret KEYSTORE_PASS)."; fi
          cp app/build/outputs/apk/release/app-release.apk DiarioMAR.apk
          gh release create "v1.${{ github.run_number }}" DiarioMAR.apk \
            --title "Diario MAR 1.${{ github.run_number }}" \
            --notes "Scarica DiarioMAR.apk dal telefono e installalo. $FIRMA" --latest
